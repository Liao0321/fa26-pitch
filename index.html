<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FA26 G1 提案比賽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>

  <main class="container">
    <section class="hero">
      <div class="row">
        <span class="tag">FLAGSHIP PITCH DAY</span>
        <span class="badge" id="invest-state">…</span>
      </div>
      <h1>5 組新創<br><span class="hl">搶奪 Flagship-coin</span></h1>
      <p class="lead">2026 年 11 月 6 日 9:00–15:30。評審化身投資人，看好哪一組，就把虛擬貨幣投給他們！</p>
      <div class="row" style="margin-top:20px">
        <a class="btn btn-primary btn-big" href="teams.html">看參賽隊伍 →</a>
        <a class="btn btn-yellow btn-big" href="schedule.html">賽程</a>
      </div>
      <div class="stat-grid">
        <div class="stat"><b>5</b><span>參賽隊伍</span></div>
        <div class="stat"><b id="stat-judge">20</b><span>評審每人 coin</span></div>
        <div class="stat"><b id="stat-default">3</b><span>其他人每人 coin</span></div>
        <div class="stat"><b>11/6</b><span>比賽日</span></div>
      </div>
    </section>

    <section class="section">
      <h2 class="section-title">我的身分</h2>
      <div class="card" id="me-card"><p class="muted">載入中…</p></div>
    </section>

    <section class="section">
      <h2 class="section-title">比賽介紹</h2>
      <div class="card prose" id="intro"><p class="muted">載入中…</p></div>
    </section>

    <section class="section">
      <h2 class="section-title">比賽規則</h2>
      <div class="card prose" id="rules"><p class="muted">載入中…</p></div>
    </section>
  </main>

  <script type="module">
    import { startPage, login, esc, watchSettings, watchContent, quotaOf } from "./js/common.js";
    import { renderText } from "./js/cards.js";

    const STATE_TEXT = {
      notOpen: ["投資尚未開放", "badge-gray"],
      open: ["投資開放中", ""],
      settled: ["投資已結算", "badge-yellow"],
    };

    let settings = null;
    let content = null;
    let profile = null;

    function render() {
      if (settings) {
        const [text, cls] = STATE_TEXT[settings.investState] || STATE_TEXT.notOpen;
        const badge = document.getElementById("invest-state");
        badge.textContent = text;
        badge.className = `badge ${cls}`;
        document.getElementById("stat-judge").textContent = settings.judgeCoins;
        document.getElementById("stat-default").textContent = settings.defaultCoins;
      }
      if (settings && content) {
        document.getElementById("intro").innerHTML = renderText(content.intro, settings);
        document.getElementById("rules").innerHTML = renderText(content.rules, settings);
      }
      const box = document.getElementById("me-card");
      if (!profile) {
        box.innerHTML = `
          <p>登入後就能看到你的身分與 Flagship-coin 額度，比賽當天用手機投資。</p>
          <button class="btn btn-primary btn-big" id="hero-login" type="button">用 @g.nccu.edu.tw 帳號登入</button>`;
        box.querySelector("#hero-login").addEventListener("click", login);
        return;
      }
      box.innerHTML = `
        <p class="muted small" style="margin:0">已登入</p>
        <h3 style="margin:0 0 8px">${esc(profile.name)}（${esc(profile.account)}）</h3>
        <div class="row">
          ${profile.roles.map((r) => `<span class="badge">${esc(r)}</span>`).join("")}
          ${settings ? `<span class="badge badge-yellow">額度 ${quotaOf(profile, settings)} Flagship-coin</span>` : ""}
        </div>`;
    }

    watchSettings((s) => { settings = s; render(); });
    watchContent((c) => { content = c; render(); });
    startPage({ active: "home", onProfile(p) { profile = p; render(); } });
  </script>
</body>
</html>
